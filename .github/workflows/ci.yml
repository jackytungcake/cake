# Demo of "run the full test suite only before merging".
#
# - Every PR push runs Lint only (cheap).
# - The full test matrix runs when:
#     1. the PR has auto-merge enabled ("Enable auto-merge" button), or
#     2. someone adds the one-shot `run-tests` label (removed again after the run), or
#     3. a push lands on main (post-merge check).
# - The merge lock is a commit status named STATUS_CONTEXT (the required check):
#     pending  -> the full tests have not run on this commit (or are running)
#     success  -> the full tests passed
#     failure  -> the full tests failed
#   A pending status blocks merging just like a failed check, but it does not
#   fail the workflow run, so an ordinary push sends no "CI failed" email.
name: CI

on:
  pull_request:
    # auto_merge_enabled: clicking "Enable auto-merge" starts the full tests.
    # labeled: adding `run-tests` starts the full tests once.
    types: [opened, synchronize, reopened, ready_for_review, labeled, auto_merge_enabled]
  push:
    branches: [main]

# A newer run on the same PR cancels the older one.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Name of the required check in the main ruleset; keep the two in sync.
  STATUS_CONTEXT: "Full tests (runs on Enable auto-merge)"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Ruff
        run: pipx run ruff check .

  decide:
    name: Decide whether to run tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    outputs:
      run_tests: ${{ steps.decide.outputs.run_tests }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          # The PR as it was when this event fired (a re-run reuses this snapshot).
          AUTO_MERGE_ON: ${{ github.event.pull_request.auto_merge != null }}
          HAS_RUN_TESTS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run-tests') }}
        run: |
          if [[ "$EVENT" != "pull_request" ]]; then
            reason="push to main: always run the full suite"; run=true
          elif [[ "$AUTO_MERGE_ON" == "true" ]]; then
            reason="auto-merge is enabled: test before merging"; run=true
          elif [[ "$HAS_RUN_TESTS_LABEL" == "true" ]]; then
            reason="the run-tests label is on the PR"; run=true
          else
            reason="ordinary PR push: lint only"; run=false
          fi
          echo "event=$EVENT action=$ACTION auto_merge=$AUTO_MERGE_ON run-tests label=$HAS_RUN_TESTS_LABEL"
          echo "run_tests=$run ($reason)"
          echo "run_tests=$run" >> "$GITHUB_OUTPUT"
          echo "### Run tests: \`$run\` — $reason" >> "$GITHUB_STEP_SUMMARY"

      # Statuses go on the PR's head commit: that is the commit the PR page and
      # the ruleset look at (github.sha is the temporary merge commit instead).
      - name: Mark the merge lock as pending
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_TESTS: ${{ steps.decide.outputs.run_tests }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$RUN_TESTS" == "true" ]]; then
            description="Running the full tests..."
          else
            description="Waiting: click Enable auto-merge, or add the run-tests label, to run the full tests"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state=pending -f context="$STATUS_CONTEXT" \
            -f description="$description" -f target_url="$RUN_URL" > /dev/null

  test:
    needs: decide
    if: needs.decide.outputs.run_tests == 'true'
    name: Test Group ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - name: Run test group ${{ matrix.group }}
        run: python3 -m unittest -v tests.test_group${{ matrix.group }}

  report-status:
    # Turns the pending status into success or failure once the tests are done.
    # `!cancelled()` rather than `always()`: a run cancelled by a newer one must
    # not overwrite the newer run's status on the same commit.
    needs: [decide, test]
    if: >-
      !cancelled() && github.event_name == 'pull_request'
      && needs.decide.outputs.run_tests == 'true'
    name: Report test status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          TEST_RESULT: ${{ needs.test.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$TEST_RESULT" == "success" ]]; then
            state=success; description="All test groups passed"
          else
            state=failure; description="The full tests did not pass: $TEST_RESULT"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" -f context="$STATUS_CONTEXT" \
            -f description="$description" -f target_url="$RUN_URL" > /dev/null
          echo "$STATUS_CONTEXT -> $state ($description)"

  remove-run-tests-label:
    # `run-tests` is one-shot: take it off once the run is over, pass or fail.
    # A label removed with GITHUB_TOKEN does not trigger another workflow run.
    needs: test
    if: always() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-tests')
    name: Remove run-tests label
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --remove-label run-tests --repo "$GITHUB_REPOSITORY"
